name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --upgrade pytest ruff
      - name: Run Ruff
        run: python -m ruff check .
      # Globbed rather than named one by one: the palette shipped while this step still checked
      # only backend_toggle.js, so a syntax error in the new file would have reached users.
      - name: Check frontend syntax
        run: for file in web/*.js; do node --check "$file"; done
      - name: Run tests
        run: python -m pytest -q
