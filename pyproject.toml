[project]
name = "minimax-h3-prompt-enhancer"
version = "0.13.0"
description = "Guide-constrained MiniMax H3 prompt enhancement with OpenAI-compatible and isolated local GGUF backends"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []
keywords = ["comfyui", "minimax-h3", "prompt-enhancement", "video-generation"]

[project.urls]
Repository = "https://github.com/hyukudan/ComfyUI-MiniMax-H3-Prompt-Enhancer"
Documentation = "https://github.com/hyukudan/ComfyUI-MiniMax-H3-Prompt-Enhancer#readme"
Issues = "https://github.com/hyukudan/ComfyUI-MiniMax-H3-Prompt-Enhancer/issues"

[tool.comfy]
PublisherId = "hyukudan"
DisplayName = "MiniMax H3 Prompt Enhancer"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
